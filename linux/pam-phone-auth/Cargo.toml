[package]
name = "pam-phone-auth"
description = "Thin PAM adapter: forwards an authentication request to phone-authd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "pam_phone_auth"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
android-fprint-protocol.workspace = true
phone-authd = { path = "../phone-authd" }
serde.workspace = true
serde_json.workspace = true
libc = "0.2"
