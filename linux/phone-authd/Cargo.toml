[package]
name = "phone-authd"
description = "Privileged-but-minimal daemon that verifies Android biometric authentications for Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "phone_authd"
path = "src/lib.rs"

[[bin]]
name = "phone-authd"
path = "src/main.rs"

[dependencies]
android-fprint-protocol.workspace = true
p256.workspace = true
sha2.workspace = true
getrandom.workspace = true
rand_core.workspace = true
hex.workspace = true
zeroize.workspace = true
serde.workspace = true
serde_json.workspace = true
libc = "0.2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "macros",
    "time",
    "sync",
    "signal",
    "fs",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
] }
rustls-pemfile = "2"
rcgen = "0.13"
mdns-sd = "0.11"

[dev-dependencies]
android-fprint-protocol.workspace = true
phone-auth-sim = { path = "../phone-auth-sim" }
hex.workspace = true
serde_json.workspace = true